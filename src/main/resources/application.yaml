spring:
  application:
    name: CreatorStore

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}